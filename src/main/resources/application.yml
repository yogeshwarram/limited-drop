spring:
  application:
    name: limited-drop
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/limited_drop}
    username: ${SPRING_DATASOURCE_USERNAME:limited_drop}
    password: ${SPRING_DATASOURCE_PASSWORD:limited_drop}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:2000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT_MS:1000}
      data-source-properties:
        connectTimeout: ${MYSQL_CONNECT_TIMEOUT_MS:1000}
        socketTimeout: ${MYSQL_SOCKET_TIMEOUT_MS:3000}
        tcpKeepAlive: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:20s}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:500ms}
      timeout: ${REDIS_COMMAND_TIMEOUT:250ms}
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    connection-timeout: ${RABBITMQ_CONNECTION_TIMEOUT:1s}
    publisher-confirm-type: correlated
    publisher-returns: true
  cache:
    type: redis
    redis:
      time-to-live: 1h
      cache-null-values: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db

server:
  shutdown: graceful
  tomcat:
    threads:
      max: ${SERVER_MAX_THREADS:50}
    accept-count: ${SERVER_ACCEPT_COUNT:100}
    connection-timeout: ${SERVER_CONNECTION_TIMEOUT:5s}

app:
  reservations:
    default-hold-duration: PT10M
    expiry-scan-delay: PT5S
    expiry-batch-size: 100
  outbox:
    publish-delay: PT0.25S
    confirm-timeout: PT5S
    claim-duration: PT30S
    retry-delay: PT5S
    batch-size: 1000
    exchange: drop.events
    audit-queue-enabled: ${APP_OUTBOX_AUDIT_QUEUE_ENABLED:false}
  seed:
    enabled: true
  security:
    issuer-uri: ${APP_SECURITY_ISSUER_URI:}
    jwk-set-uri: ${APP_SECURITY_JWK_SET_URI:}
    expected-issuer: ${APP_SECURITY_EXPECTED_ISSUER:}
    audience: ${APP_SECURITY_AUDIENCE:limited-drop-api}
    hmac-secret: ${APP_SECURITY_HMAC_SECRET:}
    dev-token-endpoint-enabled: ${APP_SECURITY_DEV_TOKEN_ENDPOINT_ENABLED:false}
