spring:
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
  datasource:
    url: jdbc:h2:mem:limiteddrop;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
  data:
    redis:
      repositories:
        enabled: false
app:
  seed:
    enabled: false
  security:
    hmac-secret: test-secret-with-at-least-thirty-two-bytes
