global
    log stdout format raw local0

defaults
    log global
    mode http
    option httplog
    timeout connect 1s
    timeout client 15s
    timeout server 15s

resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s
    hold nx 3s

frontend limited_drop_api
    bind *:8080
    acl safe_method method GET HEAD OPTIONS
    acl no_read_backend nbsrv(limited_drop_reads) eq 0
    acl no_write_backend nbsrv(limited_drop_writes) eq 0
    http-request return status 503 content-type application/json hdr Retry-After 1 lf-string '{"status":503,"code":"DATABASE_UNAVAILABLE","message":"No MySQL-ready application replica is available","path":"%[path]","violations":{}}' if safe_method no_read_backend
    http-request return status 503 content-type application/json hdr Retry-After 1 lf-string '{"status":503,"code":"DATABASE_UNAVAILABLE","message":"No MySQL-ready application replica is available","path":"%[path]","violations":{}}' if !safe_method no_write_backend
    use_backend limited_drop_reads if safe_method
    default_backend limited_drop_writes

frontend proxy_health
    bind *:8404
    monitor-uri /healthz

backend limited_drop_reads
    balance leastconn
    option redispatch
    option httpchk GET /actuator/health/readiness
    http-check expect status 200
    retries 2
    retry-on conn-failure empty-response
    default-server check inter 1s fall 2 rise 2 slowstart 5s
    server app1 app1:8080 resolvers docker init-addr libc,none
    server app2 app2:8080 resolvers docker init-addr libc,none

backend limited_drop_writes
    balance leastconn
    option httpchk GET /actuator/health/readiness
    http-check expect status 200
    retries 0
    default-server check inter 1s fall 2 rise 2 slowstart 5s
    server app1 app1:8080 resolvers docker init-addr libc,none
    server app2 app2:8080 resolvers docker init-addr libc,none
