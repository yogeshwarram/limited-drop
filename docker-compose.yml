x-app: &app
  build: .
  environment: &app-environment
    SPRING_PROFILES_ACTIVE: dev
    SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/limited_drop?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
    SPRING_DATASOURCE_USERNAME: limited_drop
    SPRING_DATASOURCE_PASSWORD: limited_drop
    SPRING_DATA_REDIS_HOST: redis
    SPRING_RABBITMQ_HOST: rabbitmq
    APP_SECURITY_HMAC_SECRET: change-this-32-byte-development-secret-now
    APP_SECURITY_DEV_TOKEN_ENDPOINT_ENABLED: "true"
  depends_on:
    mysql: {condition: service_healthy}
  stop_grace_period: 25s
  healthcheck:
    test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness | grep -q UP"]
    interval: 5s
    timeout: 3s
    retries: 12
    start_period: 20s

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: limited_drop
      MYSQL_USER: limited_drop
      MYSQL_PASSWORD: limited_drop
      MYSQL_ROOT_PASSWORD: root
    ports: ["3306:3306"]
    volumes: ["mysql-data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4-management-alpine
    ports: ["5672:5672", "15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  app1:
    <<: *app
    environment:
      <<: *app-environment
      APP_SEED_ENABLED: "true"

  app2:
    <<: *app
    environment:
      <<: *app-environment
      APP_SEED_ENABLED: "false"

  haproxy:
    image: haproxy:3.0-alpine
    ports: ["8080:8080"]
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      app1: {condition: service_started}
      app2: {condition: service_started}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8404/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  mysql-data:
